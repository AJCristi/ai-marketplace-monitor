<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Marketplace Monitor</title>
  <link rel="stylesheet" href="/static/vendor/codemirror.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#pane">Skip to content</a>
  <div class="c app" id="app" hidden>
    <header class="hd">
      <a class="brand" href="#/monitor">Marketplace Monitor</a>
      <nav class="nav" aria-label="Main navigation">
        <a id="monitor-nav" href="#/monitor">Monitor</a>
        <a id="settings-nav" href="#/settings/marketplace">Settings <span id="setup-count" class="warn"></span></a>
      </nav>
      <div class="hdr">
        <button id="theme" class="btn q sm" type="button" aria-label="Theme: system">◐</button>
        <span id="live-status" class="m d" role="status">Connecting…</span>
        <a id="browser-link" class="btn q" target="_blank" rel="noopener" hidden>Browser ↗</a>
        <button id="search-all" class="btn" type="button">↻ Search all now</button>
        <a class="btn p" href="#/monitor/new">+ Add search</a>
        <button id="logout" class="btn q" type="button" hidden>Sign out</button>
      </div>
    </header>
    <div id="global-notice" aria-live="polite"></div>
    <main class="split">
      <aside class="side" id="sidebar" aria-label="Saved searches"></aside>
      <section class="pane" id="pane" tabindex="-1" aria-label="Selected page"></section>
    </main>
    <div id="toast" role="status" hidden></div>
    <span id="feed-announcement" class="vh" aria-live="polite" aria-atomic="true"></span>
  </div>
  <dialog id="login-dialog" class="c dlg" aria-labelledby="login-title">
    <h1 id="login-title">Sign in</h1>
    <p id="login-hint" class="mu sm">Use the Facebook credentials configured when this monitor started.</p>
    <form id="login-form" class="col" style="gap:12px">
      <label for="login-username">Username</label>
      <input id="login-username" class="in" name="username" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" class="in" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="err sm" role="alert" hidden></p>
      <button class="btn p" type="submit">Sign in</button>
    </form>
  </dialog>
  <dialog id="action-dialog" class="c dlg" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div id="dialog-body" class="mu"></div>
    <div class="row" style="justify-content:flex-end">
      <button id="dialog-cancel" class="btn" type="button">Keep editing</button>
      <button id="dialog-accept" class="btn p" type="button">Continue</button>
    </div>
  </dialog>
  <script src="/static/vendor/codemirror.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
